<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0072bb">
  <meta name="description" content="Demostración local de una aplicación de documentos y salud. Sin validez oficial.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Mi espacio · Demo</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir al contenido</a>
  <header class="app-header">
    <div class="header-inner">
      <button id="menu-button" class="icon-button" aria-label="Abrir menú" aria-haspopup="dialog"></button>
      <a href="#inicio" class="brand" aria-label="Mi espacio, inicio"><span class="brand-mi">mi</span>espacio<span class="brand-demo">DEMO</span></a>
      <button id="profile-button" class="header-avatar" aria-label="Editar mi perfil"></button>
    </div>
  </header>
  <div class="demo-ribbon"><span class="demo-dot"></span>Demostración independiente · Sin validez oficial</div>
  <p id="storage-warning" class="storage-warning" hidden role="status"></p>
  <main id="main" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Navegación principal">
    <div class="nav-inner">
      <a href="#inicio" data-route="inicio"><span class="nav-icon" data-icon="home"></span><span>Inicio</span></a>
      <a href="#documentos" data-route="documentos"><span class="nav-icon" data-icon="document"></span><span>Mis documentos</span></a>
      <a href="#salud" data-route="salud"><span class="nav-icon" data-icon="heart"></span><span>Mi salud</span></a>
    </div>
  </nav>
  <dialog id="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Cerrar ventana"></button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Activá JavaScript en tu navegador para usar la demostración.</p></noscript>
</body>
</html>
